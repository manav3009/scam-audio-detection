{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 bg-gray-800/50 backdrop-blur-md p-8 rounded-2xl border border-blue-500/30 shadow-2xl">
        <div class="text-center">
            <div class="mx-auto h-12 w-12 bg-blue-500/20 rounded-full flex items-center justify-center">
                <i class="fas fa-user-shield text-2xl text-blue-500"></i>
            </div>
            <h2 class="mt-6 text-3xl font-bold text-white">Admin Access</h2>
            <p class="mt-2 text-sm text-gray-400">Enter credentials to access the dashboard</p>
        </div>
        
        <form id="loginForm" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label for="username" class="text-sm font-medium text-gray-300 block mb-2">
                        <i class="fas fa-user mr-2"></i>Username
                    </label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-2 bg-gray-900/50 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white"
                           placeholder="admin">
                </div>
                <div>
                    <label for="password" class="text-sm font-medium text-gray-300 block mb-2">
                        <i class="fas fa-key mr-2"></i>Password
                    </label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2 bg-gray-900/50 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white"
                           placeholder="••••••">
                </div>
            </div>
            
            <button type="submit" id="loginBtn"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300">
                <i class="fas fa-sign-in-alt mr-2"></i> Sign in
            </button>
        </form>
        
        <div class="text-center text-xs text-gray-500">
            <p>Default credentials: admin / admin</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Authenticating...';
        
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            window.location.href = '/dashboard';
        } else {
            alert('Invalid credentials! Use admin/admin');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Sign in';
        }
    });
</script>
{% endblock %}
